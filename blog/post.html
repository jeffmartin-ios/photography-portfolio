<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- The title will be set by the script -->
    <title>Blog Post - Jeff Martin Photography</title>

    <!-- Common Stylesheets -->
    <link rel="stylesheet" href="../styles/common.css">
    <link rel="stylesheet" href="../styles/menu.css">
    <link rel="stylesheet" href="../styles/footer.css">
    <link rel="stylesheet" href="../styles/blog.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
</head>
<body class="noto-sans-regular">

    <!-- Reusable Menu & Footer -->
    <div id="menu-overlay" class="overlay"></div>
    <div id="menu-placeholder"></div>

    <!-- The entire article will be generated by JavaScript inside this container -->
    <main id="post-container" class="content-wrapper blog-container">
        <!-- Loading message -->
        <p>Loading post...</p>
    </main>

    <div id="footer-placeholder"></div>

    <!-- Markdown Parser Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/showdown/2.1.0/showdown.min.js"></script>
    
    <!-- Scripts -->
    <script> const siteRoot = '/photography-portfolio/'; </script>
    <script src="../scripts/main.js"></script>
    <script src="../scripts/blog.js"></script>

</body>
</html>
