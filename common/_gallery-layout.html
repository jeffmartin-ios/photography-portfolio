<!-- File: common/_gallery-layout.html -->
<!-- This is the reusable structure for all gallery pages. -->

<!-- Reusable Menu Components -->
<div id="menu-overlay" class="overlay"></div>
<div id="menu-placeholder"></div>

<main class="content-wrapper">
    <div class="breadcrumb-nav">
        <a id="breadcrumb-link" href="#">&larr; Back</a>
    </div>

    <header class="gallery-hero merriweather-regular">
        <h1 id="gallery-title">[Gallery Title]</h1>
        <p id="gallery-subtitle" class="subtitle">[Gallery Subtitle]</p>
    </header>

    <div id="photo-grid-container" class="photo-grid">
        <!-- Photos will be generated here by the script -->
    </div>
</main>

<div class="zoomed-image"> 
    <img src="" alt="Zoomed View">
    <span class="close-button">&times;</span>
</div>

<footer>
    <p>&copy; Jeff Martin 2017 - 2025</p>
</footer>
