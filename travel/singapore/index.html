<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Singapore - Travel Photography</title>

    <link rel="stylesheet" href="../../styles/common.css">
    <link rel="stylesheet" href="../../styles/menu.css">

    <link rel="stylesheet" href="../../styles/gallery-page.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&family=Oswald:wght@200..700&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">

    <script>
        // Define the root path of the project on GitHub Pages
        const siteRoot = '/photography-portfolio/'; 
    </script>
</head>
<body class="noto-sans-regular">

    <div id="menu-overlay" class="overlay"></div>
    <div id="menu-placeholder"></div>

    <main class="content-wrapper">
        <div class="breadcrumb-nav">
            <a href="../">&larr; Back to Travel Galleries</a>
        </div>

        <header class="gallery-hero merriweather-regular">
            <h1>Singapore</h1>
            <p class="subtitle">Exploring the vibrant intersection of nature and metropolis in the Lion City.</p>
        </header>

        <div class="photo-grid">
            <div class="grid-item tall">
                <img src="../../photos/portfolio/singapore/jewel-waterfall.jpg" alt="The HSBC Rain Vortex, a large indoor waterfall at Jewel Changi Airport.">
            </div>
            <div class="grid-item wide">
                <img src="../../photos/portfolio/singapore/supertree.jpg" alt="A wide shot of the iconic Supertree Grove at Gardens by the Bay, lit up at night.">
            </div>
             <div class="grid-item">
                <img src="../../photos/portfolio/singapore/stairs.jpg" alt="A person ascending a colorful, art-deco styled staircase.">
            </div>
            <div class="grid-item">
                <img src="../../photos/portfolio/singapore/hawkercentre-shrine.jpg" alt="A small, colorful shrine nestled within a busy hawker centre.">
            </div>
            <div class="grid-item">
                <img src="../../photos/portfolio/singapore/garden-eagle.jpg" alt="A statue of an eagle with wings spread in a lush green garden.">
            </div>
        </div>
    </main>
    
    <div class="zoomed-image"> 
        <img src="" alt="Zoomed View">
        <span class="close-button">&times;</span>
    </div>

    <footer>
        <p>&copy; Jeff Martin 2017 - 2025</p>
    </footer>

    <script src="../../js/main.js"></script>
    <script src="../../js/gallery.js"></script>

</body>
</html>
