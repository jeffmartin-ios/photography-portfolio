<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japan - Travel Photography</title>

    <link rel="stylesheet" href="../../styles/common.css">
    <link rel="stylesheet" href="../../styles/menu.css">
    <link rel="stylesheet" href="../../styles/gallery-page.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&family=Oswald:wght@200..700&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <script>const basePath = '../../';</script>
</head>
<body class="noto-sans-regular">

    <div id="menu-overlay" class="overlay"></div>
    <div id="menu-placeholder"></div>

    <main class="content-wrapper">
        <div class="breadcrumb-nav">
            <a href="../">&larr; Back to Travel Galleries</a>
        </div>

        <header class="gallery-hero merriweather-regular">
            <h1>Japan</h1>
            <p class="subtitle">From the electric energy of Tokyo's streets to the serene landscapes of Mount Fuji.</p>
        </header>

        <div class="photo-grid">
            <div class="grid-item wide">
                <img src="../../photos/portfolio/japan/shibuyacrossing-1.jpg" alt="A long exposure shot of Shibuya Crossing at night, with light trails from traffic and crowds of people.">
            </div>
            <div class="grid-item">
                <img src="../../photos/portfolio/japan/dotonbori-crowd-1.jpg" alt="A dense crowd walking through the neon-lit Dotonbori district in Osaka.">
            </div>
            <div class="grid-item tall">
                <img src="../../photos/portfolio/japan/fujisan-railroads-1.jpg" alt="A tranquil view of Mount Fuji looming over a quiet railroad crossing in the countryside.">
            </div>
            <div class="grid-item">
                <img src="../../photos/portfolio/japan/dotonbori-alley.jpg" alt="A narrow, atmospheric alleyway in Osaka with glowing lanterns and signs.">
            </div>
            <div class="grid-item wide">
                <img src="../../photos/portfolio/japan/yodobashi-sign-1.jpg" alt="A vibrant, multi-colored Yodobashi Camera sign illuminated at night in Tokyo.">
            </div>
        </div>
    </main>
    
    <div class="zoomed-image"> 
        <img src="" alt="Zoomed View">
        <span class="close-button">&times;</span>
    </div>

    <footer>
        <p>&copy; Jeff Martin 2017 - 2025</p>
    </footer>

    <script src="../../scripts/main.js"></script>
    <script src="../../scripts/gallery.js"></script>

</body>
</html>
