<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thailand - Travel Photography</title>

    <link rel="stylesheet" href="../../styles/common.css">
    <link rel="stylesheet" href="../../styles/menu.css">

    <link rel="stylesheet" href="../../styles/gallery-page.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&family=Oswald:wght@200..700&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
</head>
<body class="noto-sans-regular">

    <div id="menu-overlay" class="overlay"></div>
    <div id="menu-placeholder"></div>

    <main class="content-wrapper">
        <div class="breadcrumb-nav">
            <a href="../">&larr; Back to Travel Galleries</a>
        </div>

        <header class="gallery-hero merriweather-regular">
            <h1>Thailand</h1>
            <p class="subtitle">The chaotic beauty of Bangkok's streets and the tranquil moments in between.</p>
        </header>

        <div class="photo-grid">
            <div class="grid-item">
                <img src="../../photos/portfolio/thailand/traffic-eagle-1.jpg" alt="An overhead view of a busy intersection in Bangkok with cars and tuk-tuks.">
            </div>
            <div class="grid-item wide">
                <img src="../../photos/portfolio/thailand/bridge-jatujak.jpg" alt="A wooden bridge crossing a canal in Chatuchak Market, Bangkok.">
            </div>
            <div class="grid-item">
                <img src="../../photos/portfolio/thailand/traffic-eagle-2.jpg" alt="Another perspective of Bangkok traffic, showing the density of the city.">
            </div>
        </div>
    </main>
    
    <div class="zoomed-image"> 
        <img src="" alt="Zoomed View">
        <span class="close-button">&times;</span>
    </div>

    <footer>
        <p>&copy; Jeff Martin 2017 - 2025</p>
    </footer>

    <script src="../../js/main.js"></script>
    <script src="../../js/gallery.js"></script>

</body>
</html>
